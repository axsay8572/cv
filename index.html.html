<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>손아영 - 자기소개</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
            background-color: #f4f6f9;
            color: #333;
            line-height: 1.6;
        }

        /* 상단 소개 영역 (남색 바탕) */
        header {
            background-color: #1a2530;
            color: #ffffff;
            text-align: center;
            padding: 60px 20px;
        }

        .profile-icon {
            font-size: 64px;
            margin-bottom: 15px;
        }

        header h1 {
            font-size: 32px;
            margin-bottom: 10px;
            font-weight: 700;
        }

        header p {
            font-size: 18px;
            color: #bdc3c7;
        }

        /* 밝은 본문 영역 (2단 구성) */
        main {
            max-width: 900px;
            margin: 40px auto;
            padding: 0 20px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 25px;
        }

        .card {
            background: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
            transition: transform 0.2s ease;
        }

        .card:hover {
            transform: translateY(-3px);
        }

        .card h2 {
            font-size: 20px;
            color: #1a2530;
            margin-bottom: 20px;
            border-bottom: 2px solid #ecf0f1;
            padding-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* 링크 버튼 스타일 */
        .link-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin-top: 15px;
            padding: 10px 16px;
            background-color: #f0f3f6;
            color: #2c3e50;
            text-decoration: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            transition: background-color 0.2s ease, color 0.2s ease;
        }

        .link-btn:hover {
            background-color: #1a2530;
            color: #ffffff;
        }

        /* 좋아하는 것 목록 */
        .hobby-list {
            list-style: none;
        }

        .hobby-list li {
            padding: 10px 0;
            border-bottom: 1px dashed #ecf0f1;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 16px;
        }

        .hobby-list li:last-child {
            border-bottom: none;
        }

        /* 목표 한 줄 카드 (전체 너비 차지) */
        .goal-card {
            grid-column: 1 / -1;
            background: linear-gradient(135deg, #2c3e50, #1a2530);
            color: #ffffff;
            text-align: center;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }

        .goal-card h2 {
            color: #ffffff;
            border-bottom: 2px solid rgba(255, 255, 255, 0.1);
            justify-content: center;
        }

        .goal-card p {
            font-size: 18px;
            font-weight: 500;
            margin-top: 15px;
            color: #ecf0f1;
        }

        /* 하단 명함 스타일 카드 (가운데 정렬) */
        .business-card-wrapper {
            grid-column: 1 / -1;
            display: flex;
            justify-content: center;
            margin-top: 10px;
        }

        .business-card {
            background: #ffffff;
            width: 100%;
            max-width: 400px;
            padding: 25px 30px;
            border-radius: 16px;
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.08);
            border: 2px dashed #cbd5e1;
            text-align: center;
        }

        .business-card .bc-icon {
            font-size: 36px;
            margin-bottom: 8px;
        }

        .business-card h3 {
            font-size: 20px;
            color: #1a2530;
            margin-bottom: 5px;
        }

        .business-card p {
            font-size: 15px;
            color: #64748b;
        }

        /* 반응형 디자인 (스마트폰 대응) */
        @media (max-width: 768px) {
            main {
                grid-template-columns: 1fr;
                margin: 20px auto;
            }
            header {
                padding: 40px 20px;
            }
            header h1 {
                font-size: 26px;
            }
        }
    </style>
</head>
<body>

    <!-- 상단 소개 영역 -->
    <header>
        <div class="profile-icon">👩‍💼</div>
        <h1>손아영</h1>
        <p>경영학과 3학년</p>
    </header>

    <!-- 밝은 본문 영역 (2단 구성) -->
    <main>
        <!-- 관심 분야 카드 -->
        <section class="card">
            <h2>🎯 관심 분야</h2>
            <p style="font-size: 18px; color: #34495e; font-weight: 600; padding: 5px 0;">
                💼 인사 HR
            </p>
            <p style="color: #7f8c8d; font-size: 15px; margin-bottom: 15px;">
                조직과 구성원이 함께 성장할 수 있는 인사 전략 및 제도에 깊은 관심을 가지고 공부하고 있습니다.
            </p>
            <!-- 좋아하는 사이트 링크 (새 탭 열기) -->
            <a href="https://www.instagram.com/ax_say?stkn=MTdlajR3MGoxZjA1dA%3D%3D&utm_source=qr" target="_blank" rel="noopener noreferrer" class="link-btn">
                🔗 즐겨찾는 인스타그램 방문하기
            </a>
        </section>

        <!-- 좋아하는 것 카드 -->
        <section class="card">
            <h2>✨ 좋아하는 것</h2>
            <ul class="hobby-list">
                <li>💬 다양한 사람들과의 소통</li>
                <li>📦 신제품 리뷰 찾아보기</li>
                <li>🏃‍♀️ 운동하기</li>
            </ul>
        </section>

        <!-- 목표 한 줄 카드 -->
        <section class="goal-card">
            <h2>🌟 목표</h2>
            <p>"늘 새롭고 유익한 가치를 만들어내겠습니다"</p>
        </section>

        <!-- 하단 명함 스타일 카드 (이름·관심사) -->
        <div class="business-card-wrapper">
            <div class="business-card">
                <div class="bc-icon">🏷️</div>
                <h3>손아영</h3>
                <p>관심사: 인사 HR</p>
            </div>
        </div>
    </main>

</body>
</html>
